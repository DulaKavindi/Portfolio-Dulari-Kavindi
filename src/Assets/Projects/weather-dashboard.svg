<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="weatherBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#190e38" />
      <stop offset="100%" stop-color="#0a0518" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="weatherGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#weatherBg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="250" y1="0" x2="250" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="550" y1="0" x2="550" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Orb Glow -->
  <circle cx="400" cy="190" r="120" fill="#38bdf8" opacity="0.12" filter="url(#weatherGlow)"/>

  <!-- Central Graphic: Sun + Cloud + Security Shield -->
  <g transform="translate(400, 180)">
    <!-- Sun behind cloud -->
    <circle cx="-35" cy="-35" r="38" fill="url(#sunGrad)"/>
    
    <!-- Cloud shape -->
    <path d="M-60 10 A35 35 0 0 1 -15 -25 A42 42 0 0 1 50 -15 A35 35 0 0 1 70 20 A30 30 0 0 1 45 45 L-40 45 A30 30 0 0 1 -60 10 Z" fill="url(#cloudGrad)" opacity="0.95"/>

    <!-- Security Shield (Auth0 / JWT / MFA) -->
    <g transform="translate(48, 15)">
      <path d="M0 -30 Q28 -30 32 -10 Q32 25 0 45 Q-32 25 -32 -10 Q-28 -30 0 -30 Z" fill="#1e1038" stroke="url(#shieldGrad)" stroke-width="3"/>
      <!-- Lock Keyhole -->
      <circle cx="0" cy="3" r="7" fill="#fdf4ff"/>
      <path d="M-3 8 L3 8 L5 20 L-5 20 Z" fill="#fdf4ff"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">
    Secure Weather Dashboard
  </text>
  <text x="400" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#38bdf8" letter-spacing="0.5">
    Full-Stack with Auth0, JWT &amp; MFA
  </text>

  <!-- Tech Badges -->
  <g transform="translate(400, 425)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
    <rect x="-240" y="-16" width="90" height="30" rx="15" fill="#18223d" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="-195" y="4" fill="#bae6fd">Angular</text>

    <rect x="-135" y="-16" width="105" height="30" rx="15" fill="#18223d" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="-82" y="4" fill="#bae6fd">Spring Boot</text>

    <rect x="-15" y="-16" width="80" height="30" rx="15" fill="#2d164d" stroke="#c084fc" stroke-width="1.2"/>
    <text x="25" y="4" fill="#e9d5ff">Auth0</text>

    <rect x="80" y="-16" width="145" height="30" rx="15" fill="#2d164d" stroke="#c084fc" stroke-width="1.2"/>
    <text x="152" y="4" fill="#e9d5ff">OpenWeather API</text>
  </g>
</svg>
